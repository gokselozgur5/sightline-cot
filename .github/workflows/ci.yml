name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo fmt check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable && rustup default stable
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable && rustup default stable
      - name: Run tests
        run: cargo test --all-targets
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable && rustup default stable
      - name: Run tests
        run: cargo test --all-targets
      - name: Build static library
        run: cargo build --release
      - name: Compile and run C test
        run: |
          cat <<EOF > test.c
          #include "include/sightline.h"
          int main() { return 0; }
          EOF
          cc -std=c99 -Wall -Wextra -pedantic test.c -Ltarget/release -lsightline -o test
          ./test

