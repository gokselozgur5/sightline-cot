[package]
name = "sightline-cot"
version = "0.6.0"
edition = "2021"
rust-version = "1.70"
description = "Sightline COT library"
license = "MIT"
repository = "https://github.com/gokselozgur5/sightline-cot"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]

[features]
default = []
geodesy = []
grid = ["geodesy"]
xml-tools = []
experimental = ["geodesy"]
full = ["geodesy", "grid", "xml-tools", "experimental"]
